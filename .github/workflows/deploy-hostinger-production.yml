name: Deploy Production To Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, tokenizer, xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deployment archive
        run: |
          mkdir -p .deploy
          tar \
            --exclude=.deploy \
            --exclude=.env \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=tests \
            --exclude=storage/logs \
            --exclude=storage/framework/cache/data \
            -czf .deploy/release.tar.gz .

      - name: Check deployment secrets
        id: check-secrets
        env:
          HOSTINGER_HOST: ${{ vars.PROD_HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ vars.PROD_HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PORT: ${{ vars.PROD_HOSTINGER_PORT }}
          HOSTINGER_APP_PATH: ${{ vars.PROD_HOSTINGER_APP_PATH }}
          HOSTINGER_PUBLIC_PATH: ${{ vars.PROD_HOSTINGER_PUBLIC_PATH }}
        run: |
          missing=0
          for secret in HOSTINGER_HOST HOSTINGER_USER HOSTINGER_SSH_KEY HOSTINGER_PORT HOSTINGER_APP_PATH HOSTINGER_PUBLIC_PATH; do
            if [ -z "${!secret}" ]; then
              echo "::warning::Deployment setting '$secret' is not configured."
              missing=$((missing+1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::warning::$missing deployment setting(s) are missing. Skipping deployment. Configure them in: Settings > Secrets and variables > Actions"
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "All required deployment settings are present."
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure remote directories exist
        if: steps.check-secrets.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PROD_HOSTINGER_HOST }}
          username: ${{ vars.PROD_HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ vars.PROD_HOSTINGER_PORT }}
          script: |
            mkdir -p "${{ vars.PROD_HOSTINGER_APP_PATH }}"
            mkdir -p "${{ vars.PROD_HOSTINGER_PUBLIC_PATH }}"
            mkdir -p "${{ vars.PROD_HOSTINGER_APP_PATH }}/storage/framework/cache"
            mkdir -p "${{ vars.PROD_HOSTINGER_APP_PATH }}/storage/framework/sessions"
            mkdir -p "${{ vars.PROD_HOSTINGER_APP_PATH }}/storage/framework/views"
            mkdir -p "${{ vars.PROD_HOSTINGER_APP_PATH }}/storage/logs"
            mkdir -p "${{ vars.PROD_HOSTINGER_APP_PATH }}/bootstrap/cache"

      - name: Upload release archive
        if: steps.check-secrets.outputs.can_deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PROD_HOSTINGER_HOST }}
          username: ${{ vars.PROD_HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ vars.PROD_HOSTINGER_PORT }}
          source: ".deploy/release.tar.gz"
          target: ${{ vars.PROD_HOSTINGER_APP_PATH }}
          strip_components: 1

      - name: Deploy release
        if: steps.check-secrets.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PROD_HOSTINGER_HOST }}
          username: ${{ vars.PROD_HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ vars.PROD_HOSTINGER_PORT }}
          script: |
            set -e

            APP_PATH="${{ vars.PROD_HOSTINGER_APP_PATH }}"
            PUBLIC_PATH="${{ vars.PROD_HOSTINGER_PUBLIC_PATH }}"

            cd "$APP_PATH"
            tar -xzf release.tar.gz
            rm -f release.tar.gz

            if [ ! -f .env ]; then
              cp .env.example .env
              echo "Created .env from .env.example. Update production values before using the site."
            fi

            php artisan down || true

            find "$PUBLIC_PATH" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} +
            cp -R public/. "$PUBLIC_PATH/"

            cat > "$PUBLIC_PATH/index.php" <<PHP
            <?php

            use Illuminate\Foundation\Application;
            use Illuminate\Http\Request;

            define('LARAVEL_START', microtime(true));

            if (file_exists(
              \$maintenance = '${{ vars.PROD_HOSTINGER_APP_PATH }}/storage/framework/maintenance.php'
            )) {
                require \$maintenance;
            }

            require '${{ vars.PROD_HOSTINGER_APP_PATH }}/vendor/autoload.php';

            /** @var Application \$app */
            \$app = require_once '${{ vars.PROD_HOSTINGER_APP_PATH }}/bootstrap/app.php';

            \$app->handleRequest(Request::capture());
            PHP

            if [ -L "$PUBLIC_PATH/storage" ] || [ -e "$PUBLIC_PATH/storage" ]; then
              rm -rf "$PUBLIC_PATH/storage"
            fi
            ln -s "$APP_PATH/storage/app/public" "$PUBLIC_PATH/storage" || true

            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up || true
