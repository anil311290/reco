publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  data_table_2: ^2.7.2
  dio: ^5.9.1
  dropdown_button2: ^3.1.0
  font_awesome_flutter: ^10.11.0
  get: ^4.7.3
  get_storage: ^2.1.1
  google_fonts: ^8.0.2
  internet_connection_checker_plus: ^3.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pretty_dio_logger: ^1.4.0
  flutter_screenutil: ^5.9.3
  share_plus: ^11.0.0
  sqflite: ^2.4.2+1
  uuid: ^4.6.0
  url_launcher: ^6.3.1

dev_dependencies:
